<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body, #terminal {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020509;
    }

    body {
      touch-action: none;
    }

    #terminal .xterm {
      box-sizing: border-box;
      height: 100%;
      padding: 8px 6px;
    }

    /*
     * A terminal is useful from its prompt upwards. During the IME resize xterm's old
     * canvas can briefly be taller than the new WebView, so top anchoring hides the prompt.
     * Move both the renderer and IME helper by the live surplus (positive or negative) and
     * keep the last terminal row pinned to the bottom edge of the available phone viewport.
     */
    #terminal .xterm-screen,
    #terminal .xterm-helpers {
      transform: translateY(var(--tw-terminal-bottom-offset, 0px));
    }

    .xterm-viewport {
      background: #020509 !important;
    }
  </style>
</head>
<body>
<div id="terminal" role="application" aria-label="Remote terminal"></div>
<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script>
  (() => {
    let terminal;
    let fitAddon;
    let ready = false;
    let readOnly = false;
    let lastCols = 0;
    let lastRows = 0;
    let fontSize = 14;
    let fitTimer = 0;
    let fitFrame = 0;
    let inputTimer = 0;
    let inputBuffer = '';
    let lastBottomOffset = Number.NaN;
    const pending = [];

    function flushInput() {
      if (inputTimer) {
        clearTimeout(inputTimer);
        inputTimer = 0;
      }
      if (!inputBuffer) return;
      const data = inputBuffer;
      inputBuffer = '';
      TwBridge.input(data);
    }

    function queueInput(data) {
      if (readOnly || !data) return;
      inputBuffer += data;
      // Submit/control keys must never sit behind a timer. Printable IME/key bursts can be
      // coalesced briefly, cutting the two-fsync-per-frame host write amplification sharply.
      if (inputBuffer.length >= 4096 || /[\x00-\x1f\x7f]/.test(data)) {
        flushInput();
        return;
      }
      if (!inputTimer) inputTimer = setTimeout(flushInput, 12);
    }

    function pinTerminalBottom() {
      if (!terminal || !terminal.element) return;
      const xterm = terminal.element;
      const screen = xterm.querySelector('.xterm-screen');
      if (!screen) return;
      const style = window.getComputedStyle(xterm);
      const paddingTop = Number.parseFloat(style.paddingTop) || 0;
      const paddingBottom = Number.parseFloat(style.paddingBottom) || 0;
      const availableHeight = Math.max(0, xterm.clientHeight - paddingTop - paddingBottom);
      const screenHeight = screen.getBoundingClientRect().height;
      const offset = availableHeight - screenHeight;
      // Resize/fit signals can overlap. Avoid invalidating renderer style when its exact
      // bottom position did not move; historical output itself never changes this geometry.
      if (Number.isFinite(lastBottomOffset) && Math.abs(offset - lastBottomOffset) < 0.25) return;
      lastBottomOffset = offset;
      xterm.style.setProperty('--tw-terminal-bottom-offset', `${offset}px`);
    }

    function fit() {
      if (!ready || !terminal || !fitAddon) return;
      try {
        fitAddon.fit();
        // A resize may preserve a manually scrolled viewport. The phone input surface must
        // instead follow the active prompt, including while the keyboard animates into place.
        terminal.scrollToBottom();
        pinTerminalBottom();
        if (terminal.cols && terminal.rows &&
            (terminal.cols !== lastCols || terminal.rows !== lastRows)) {
          lastCols = terminal.cols;
          lastRows = terminal.rows;
          TwBridge.resize(lastCols, lastRows);
        }
      } catch (_) {
      }
    }

    function fitBurst() {
      // IME animation can fan out through window, visualViewport and three ResizeObservers.
      // Coalesce that burst into one trailing fit so xterm does not repeatedly discard and
      // recreate its renderer canvas while Android is still changing the WebView bounds.
      // Pin the old canvas immediately. If it is taller than the newly exposed viewport this
      // intentionally produces a negative offset, cropping from the top instead of the prompt.
      pinTerminalBottom();
      if (fitTimer) clearTimeout(fitTimer);
      fitTimer = setTimeout(() => {
        fitTimer = 0;
        if (window.requestAnimationFrame) {
          if (fitFrame) cancelAnimationFrame(fitFrame);
          fitFrame = requestAnimationFrame(() => {
            fitFrame = 0;
            fit();
          });
        } else {
          fit();
        }
      }, 120);
    }

    function lineHeight() {
      const row = document.querySelector('#terminal .xterm-rows > div');
      return row ? row.getBoundingClientRect().height : 16;
    }

    function installTouchScroll() {
      const element = document.getElementById('terminal');
      let startX = 0;
      let startY = 0;
      let lastY = 0;
      let accumulated = 0;
      let scrolling = false;

      element.addEventListener('touchstart', event => {
        if (event.touches.length !== 1) return;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        lastY = startY;
        accumulated = 0;
        scrolling = false;
      }, { passive: true, capture: true });

      element.addEventListener('touchmove', event => {
        if (!ready || !terminal || event.touches.length !== 1) return;
        const x = event.touches[0].clientX;
        const y = event.touches[0].clientY;
        const dx = Math.abs(x - startX);
        const totalY = Math.abs(y - startY);
        if (!scrolling && totalY > 8 && totalY > dx * 1.2) scrolling = true;
        if (!scrolling) return;
        event.preventDefault();
        accumulated += y - lastY;
        lastY = y;
        const lines = accumulated / lineHeight();
        if (Math.abs(lines) >= 1) {
          const whole = lines > 0 ? Math.floor(lines) : Math.ceil(lines);
          terminal.scrollLines(-whole);
          accumulated -= whole * lineHeight();
        }
      }, { passive: false, capture: true });

      const stop = () => {
        scrolling = false;
        accumulated = 0;
      };
      element.addEventListener('touchend', stop, { passive: true, capture: true });
      element.addEventListener('touchcancel', stop, { passive: true, capture: true });
    }

    function initialize() {
      terminal = new Terminal({
        fontFamily: 'Roboto Mono, Menlo, ui-monospace, monospace',
        fontSize,
        lineHeight: 1.18,
        cursorBlink: true,
        cursorStyle: 'bar',
        // Relay owns durable output. Keep only a bounded local viewing window so a constrained
        // Android WebView renderer cannot be evicted while the keyboard changes the canvas size.
        scrollback: 1000,
        allowTransparency: false,
        // Keep Android IME composition on xterm's insertText path. In screen-reader
        // mode Gboard's composing textarea replacements are emitted as cumulative data.
        // xterm.js also carries the upstream IME finalization fix from xtermjs/xterm.js#5024
        // (commit 52e8a75), bounding the prior edit at the next composition start.
        screenReaderMode: false,
        theme: {
          background: '#020509',
          foreground: '#d5dae2',
          cursor: '#b794f6',
          cursorAccent: '#020509',
          selectionBackground: 'rgba(183,148,246,0.30)',
          black: '#191e27', red: '#f76060', green: '#67d584', yellow: '#f2b249',
          blue: '#90cdf4', magenta: '#d6bcfa', cyan: '#81e6d9', white: '#edf1f5',
          brightBlack: '#67707e', brightRed: '#feb2b2', brightGreen: '#9ae6b4',
          brightYellow: '#fbd38d', brightBlue: '#90cdf4', brightMagenta: '#b794f6',
          brightCyan: '#81e6d9', brightWhite: '#ffffff'
        }
      });
      fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(document.getElementById('terminal'));
      installTouchScroll();
      terminal.onData(data => {
        queueInput(data);
      });
      terminal.onResize(size => {
        lastCols = size.cols;
        lastRows = size.rows;
        TwBridge.resize(size.cols, size.rows);
        pinTerminalBottom();
      });
      window.addEventListener('resize', fitBurst);
      if (window.visualViewport) {
        visualViewport.addEventListener('resize', fitBurst);
        visualViewport.addEventListener('scroll', fitBurst);
      }
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(fitBurst);
        observer.observe(document.documentElement);
        observer.observe(document.body);
        observer.observe(document.getElementById('terminal'));
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flushInput();
        else fitBurst();
      });
      window.addEventListener('pagehide', flushInput);
      ready = true;
      fitBurst();
      pending.splice(0).forEach(data => terminal.write(data));
      terminal.focus();
      TwBridge.ready();
    }

    window.twWrite = data => {
      if (ready) terminal.write(data);
      else pending.push(data);
    };
    window.twWriteBytesWithAck = (callbackId, encoded) => {
      if (!ready || !terminal || typeof callbackId !== 'string' ||
          typeof encoded !== 'string') return false;
      try {
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        terminal.write(bytes, () => TwBridge.parserMutationApplied(callbackId, true));
      } catch (_) {
        TwBridge.parserMutationApplied(callbackId, false);
      }
      return true;
    };
    window.twReset = data => {
      if (!ready) {
        pending.length = 0;
        if (data) pending.push(data);
        return;
      }
      terminal.reset();
      if (data) terminal.write(data);
      terminal.focus();
      fitBurst();
    };
    window.twResetWithAck = callbackId => {
      if (!ready || !terminal || typeof callbackId !== 'string') return false;
      try {
        terminal.reset();
        terminal.focus();
        fitBurst();
        TwBridge.parserMutationApplied(callbackId, true);
      } catch (_) {
        TwBridge.parserMutationApplied(callbackId, false);
      }
      return true;
    };
    window.twSendKey = data => {
      if (!ready || readOnly) return;
      terminal.write(data);
      queueInput(data);
    };
    window.twSetReadOnly = value => {
      if (Boolean(value)) flushInput();
      readOnly = Boolean(value);
    };
    window.twSetFontSize = value => {
      fontSize = Math.max(10, Math.min(24, Number(value) || 14));
      if (ready) {
        terminal.options.fontSize = fontSize;
        fitBurst();
      }
    };
    window.twFit = fitBurst;
    window.twFocus = () => {
      if (ready) terminal.focus();
    };
    window.twBlur = () => {
      if (!ready) return;
      const textarea = document.querySelector('#terminal textarea');
      if (textarea) textarea.blur();
    };

    if (window.Terminal && window.FitAddon) initialize();
    else TwBridge.failed('Bundled xterm assets failed to initialize');
  })();
</script>
</body>
</html>
